[package]
license = "Apache-2.0"
name = "shared"
version = "1.0.0"
edition = "2024"

[features]
# Side seams: `client` turns on the lib's wasm machinery (the JS-row
# decode lives in sync's `client` feature) so Note's FromRow impl can
# compile; `server` pulls sqlx for Note's sqlx::FromRow impl.
client = ["oxylite/client"]
server = ["dep:sqlx"]

[dependencies]
enum-iterator = "2"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde", "v7", "js"] }
serde_json = "1"
# The lib owns the protocol now (#31): DTOs, Timestamp, SyncRow,
# SyncTable. Core only — this crate never pulls sync's wasm machinery
# unless the `client` feature asks for it.
oxylite = { path = "../oxylite", default-features = false }
# Parsing/canonicalizing only (no clock): `Utc::now` is platform-specific
# (the client's clock is js_sys::Date), so the type parses what a
# producer hands it — it never reads the clock itself.
chrono = { version = "0.4", default-features = false, features = ["std"] }
thiserror = "2"
sqlx = { version = "0.8", optional = true, features = [
    "runtime-tokio",
    "postgres",
    "chrono",
    "uuid",
] }
