[package]
license = "Apache-2.0"
name = "shared"
version = "0.1.0"
edition = "2024"

[dependencies]
enum-iterator = "2"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde", "v7", "js"] }
serde_json = "1"
# Parsing/canonicalizing only (no clock): `Utc::now` is platform-specific
# (the client's clock is js_sys::Date), so the type parses what a
# producer hands it — it never reads the clock itself.
chrono = { version = "0.4", default-features = false, features = ["std"] }
