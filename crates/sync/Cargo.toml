[package]
license = "Apache-2.0"
name = "sync"
version = "0.1.0"
edition = "2024"

[features]
# Server-side machinery (Postgres via sqlx). Off by default so the wasm
# client build never pulls sqlx; the backend enables it.
server = ["dep:sqlx", "dep:enum-iterator"]

[dependencies]
shared = { path = "../shared" }
dioxus = { version = "0.7", features = ["web"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
serde = "1"
serde_json = "1"
uuid = { version = "1", features = ["v7", "js", "serde"] }
web-sys = { version = "0.3", features = [
    "WebSocket",
    "MessageEvent",
    "Location",
    "BroadcastChannel",
    "Navigator",
    "LockManager",
    "LockOptions",
    "Lock",
] }
thiserror = "2"
sqlx = { version = "0.8", optional = true, features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "json",
] }
enum-iterator = { version = "2", optional = true }
