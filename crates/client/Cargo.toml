[package]
license = "Apache-2.0"
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }
sync = { path = "../sync", features = ["client"] }
dioxus = { version = "0.7", features = ["web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
