[package]
license = "Apache-2.0"
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }
dioxus = { version = "0.7", features = ["web"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4", "js"] }
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "Location"] }
console_error_panic_hook = "0.1"
