[package]
license = "Apache-2.0"
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
# `client` enables shared's client seam (sync's wasm machinery + Note's
# JS-row decode) — explicit here, no feature-unification luck.
shared = { path = "../shared", features = ["client"] }
oxylite = { path = "../oxylite", features = ["client"] }
dioxus = { version = "0.7", features = ["web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
