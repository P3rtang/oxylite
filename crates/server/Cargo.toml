[package]
license = "Apache-2.0"
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }
sync_lib = { path = "../sync", package = "sync", features = ["server"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "json", "migrate", "chrono"] }
serde_json = "1"
enum-iterator = "2"
uuid = { version = "1", features = ["serde", "v7"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
thiserror = "2.0.20"
