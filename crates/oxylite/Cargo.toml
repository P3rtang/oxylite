[package]
license = "Apache-2.0"
name = "oxylite"
version = "0.1.3"
edition = "2024"
description = "offline-first sync for PGlite and real postgres: websocket protocol, LWW ops, tombstones, snapshots, pub/sub push, and a generic engine + server core"
repository = "https://github.com/P3rtang/oxylite"
keywords = ["offline-first", "sync", "postgres", "pglite", "wasm"]
# The vendored PGlite bundle (17MB) is demo-serving material — the server
# ServeDir and the browser need it, no lib source references it, and
# crates.io caps packages at 10MB compressed. Consumers vendor it from
# npm (electric-sql/pglite) exactly as the demo did (pglite.rs's docs).
# The boot snippet the lib DOES embed stays.
exclude = ["assets/pglite"]

[features]
# The wasm client half: engine, PGlite bridge, reactive queries. Off in
# host builds, so the server graph compiles zero browser machinery
# (previously the wasm modules stub-compiled host-side).
client = [
    "dep:dioxus",
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "dep:futures",
]
# The in-process pub/sub bus (2.2): transport-free, sqlx-free — its own
# feature so a backend can take the bus without the sqlx half (reviewer:
# "it does stand on its own"). Tokio's mpsc is the only machinery.
pubsub = ["dep:tokio"]
# Server-side protocol machinery (Postgres via sqlx). Off by default so
# the wasm client build never pulls sqlx; the backend enables it. The
# wake bus rides along — the listener adapter + sessions are its first
# consumers.
server = ["dep:sqlx", "pubsub"]
# The WS transport, axum flavor: one drop-in route for any axum
# backend. Framework mounts are separate features by design — a future
# actix backend would add its own module over the same `server` core
# (reviewer decision, #28 r2), so the core never grows a dependency on
# one web framework.
axum = ["server", "dep:axum"]

[dependencies]
dioxus = { version = "0.7", features = ["web"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
# The event-driven inbox (#38): the socket's onmessage closure sends
# parsed ServerMsgs; the session loop awaits them — no 150ms poll.
# Unbounded = the callback never blocks (sync context); the receiver
# sees a Closed sentinel on socket death (forgotten wasm closures never
# drop their senders, so death rides the stream, not drop). std = the
# channel + StreamExt without the full futures kitchen.
futures = { version = "0.3", default-features = false, features = ["std"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "js", "serde"] }
# The core is pure now (DTOs + Timestamp live here, #31): chrono without
# the clock — `Utc::now` is platform-specific (the client's clock is
# js_sys::Date), so the type parses what a producer hands it — it never
# reads the clock itself.
chrono = { version = "0.4", default-features = false, features = ["std"] }
enum-iterator = "2"
web-sys = { version = "0.3", optional = true, features = [
    "WebSocket",
    "MessageEvent",
    "Location",
    "BroadcastChannel",
    "Navigator",
    "LockManager",
    "LockOptions",
    "Lock",
    "Window",
    "IdbFactory",
    "IdbOpenDbRequest",
    "IdbDatabase",
    "IdbObjectStore",
    "IdbRequest",
    "DomException",
    "Storage",
] }
thiserror = "2"
axum = { version = "0.8", features = ["ws"], optional = true }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"], optional = true }
sqlx = { version = "0.8", optional = true, features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "json",
    "chrono",
    "migrate",
] }

# The migration standard's compile-time half: `oxylite::migrations!`
# embeds the consumer's migrations/ dir. Published BEFORE oxylite (the
# dependency arrow points this way) — the release flow tags both.
oxylite-migrations = { path = "../oxylite-migrations", version = "0.1.3" }

# The bus suite needs tokio's runtime — feature-gated via
# required-features so default builds skip the target entirely (absent,
# not vacuously passing).
[[test]]
name = "pubsub_bus"
required-features = ["pubsub"]

