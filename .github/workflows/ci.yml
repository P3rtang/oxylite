# CI (roadmap 3.1, #39; publish order #40): the gate on every PR/push,
# and — ONLY on an `oxylite-v*` tag — the publish of the LIB to
# crates.io. BOTH lib crates release in lockstep (one tag, one version —
# the macro crate is welded to oxylite's merge contract), and the
# dependency arrow dictates the order: oxylite-migrations FIRST, then
# oxylite (its publish resolves the registry dep and fails while the
# dependency version is not live). The demo (shared/server/client) never
# ships: GitHub stores the testing site, crates.io gets the library.
#
# Shape notes:
# - Postgres comes from the repo's compose.yaml (docker compose — CI
#   exports COMPOSE="docker compose"; locally everything stays podman).
# - The checked sqlx macros prepare at compile time, so `cargo test`
#   needs the schema to EXIST before the build: the committed dump
#   (db-default.sh restore) is the migration.
# - `test.sh --lint` covers fmt + clippy (host + wasm) + build + all
#   Rust suites; the bus suite is feature-gated and runs inside it.
# - The publish job double-checks the tag against BOTH crate versions
#   AND oxylite's dependency requirement (consistency by construction —
#   a drifted tag fails loudly, it does not ship whatever number it
#   carries).
name: ci

on:
  push:
    branches: [main]
    tags: ["oxylite-v*"]
  pull_request:
  workflow_dispatch:

env:
  COMPOSE: docker compose
  DATABASE_URL: postgres://sync:sync@localhost:5432/offline_notes
  DX_VERSION: "0.7.10"
  BUN_VERSION: "1.4.2"

jobs:
  rust-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: postgres up + default state (macros prepare against it)
        run: |
          docker compose up -d
          ./scripts/db-default.sh restore
      - run: ./test.sh --lint

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: bun deps
        run: cd e2e && bun install --frozen-lockfile
      - name: playwright chromium (+ system deps)
        run: cd e2e && bunx playwright install --with-deps chromium
      - name: cargo-binstall (the standard prebuilt-binary path)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      - name: dx (prebuilt release via binstall — no source build)
        # -y = --no-confirm (binstall's non-interactive flag; there is
        # no --yes long form).
        run: cargo binstall -y "dioxus-cli@${DX_VERSION}"
      - name: gate + e2e (dist freshness is owned by the webServer step)
        env:
          WEB_SERVER_TIMEOUT: "600000"
        run: ./test.sh --e2e

  publish:
    # Tag push only: `oxylite-v*` after the gate is green. Lockstep
    # release: the version lives in BOTH manifests (release.sh bumps
    # them together); crates.io forbids re-publishing a version.
    if: startsWith(github.ref, 'refs/tags/oxylite-v')
    needs: [rust-gate, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: the tag must match both crate versions AND the dep requirement
        run: |
          TAG="${GITHUB_REF#refs/tags/oxylite-v}"
          for CRATE in oxylite-migrations oxylite; do
            V="$(cargo metadata --no-deps --format-version 1 \
              | jq -r ".packages[] | select(.name == \"$CRATE\") | .version")"
            echo "tag $TAG — $CRATE $V"
            [ "$TAG" = "$V" ] || {
              echo "tag and $CRATE version drift — bump the manifest, re-tag"
              exit 1
            }
          done
          REQ="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "oxylite") | .dependencies[] | select(.name == "oxylite-migrations") | .req')"
          echo "oxylite requires oxylite-migrations $REQ"
          [ "^$TAG" = "$REQ" ] || {
            echo "oxylite's dependency requirement on oxylite-migrations drifted from the tag — fix the manifest, re-tag"
            exit 1
          }
      - name: standalone verify (the macro crate has no deps — full check possible pre-publish)
        run: cargo publish -p oxylite-migrations --dry-run
      - name: publish oxylite-migrations (first in the dependency arrow)
        env:
          # The env var is cargo's preferred path (`--token` on the CLI
          # is deprecated). The token needs publish-new for the FIRST
          # release (it creates the crate); publish-update covers the rest.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p oxylite-migrations
      - name: wait for the registry, verifying oxylite's package while waiting
        # cargo resolves oxylite's registry dependency at packaging time,
        # so its verification can only pass once oxylite-migrations is
        # LIVE on crates.io — which lags the upload by seconds to minutes
        # (the index queue). The retry loop is both the waiter and
        # oxylite's own full verification (packaging + compile).
        run: |
          for i in $(seq 1 18); do
            if cargo publish -p oxylite --dry-run; then
              echo "oxylite-migrations is live — oxylite verified"
              exit 0
            fi
            echo "attempt $i/18 — the dependency is not live yet, retrying in 10s"
            sleep 10
          done
          echo "oxylite-migrations never became resolvable within 3min — check its publish step"
          exit 1
      - name: publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p oxylite
