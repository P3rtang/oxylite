[package]
name = "counter"
version = "0.1.0"
edition = "2024"
publish = false

# One workspace, client-owned: this package is the wasm app AND the
# workspace root — `shared` and `server` are members (the demo's
# three-crate shape in miniature). Nested [workspace] roots do not
# compose ("multiple workspace roots found").
[workspace]
members = ["shared", "server"]

[dependencies]
# 0.1.6: the migration standard, the typed boot reads, the engine's
# write path (upsert/delete/now), the reactive queries, the
# SqlType-typed SyncRow::TYPES, the use_resource read hook (0.1.5
# carries #45; 0.1.6 adds #46) and `ack-pull`. `default-features =
# false` turns off the `ack-pull` default feature: the
# ack-triggered re-pull sent a Pull after every Ack — pre-2.2 the only
# way a client learned the backlog its own push created, but with the
# NOTIFY stream the server already pushes the same seqs (in ~10ms),
# so keeping it doubled every write's delivery: two "received N
# events" drains + an empty follow-up per bump. This example's server
# is sync_router (push driver built in), so the flag-off engine is the
# right shape — and the drain logs go quiet.
oxylite = { version = "0.1.6", default-features = false, features = ["client"] }
# The app's own data crate (row + table + migrations) — the demo's
# shared/shape in miniature.
counter-shared = { path = "shared", features = ["client"] }
dioxus = { version = "0.7", features = ["web"] }
console_error_panic_hook = "0.1"
# UUIDv7 client-generated ids — the protocol's row-id convention.
uuid = { version = "1", features = ["v7", "js"] }
